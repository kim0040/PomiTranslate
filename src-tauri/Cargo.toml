[package]
name = "pomitranslate"
version = "0.1.0"
description = "PomiTranslate desktop application"
authors = ["PomiTranslate contributors"]
edition = "2021"

[lib]
name = "pomitranslate_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ring = "=0.17.14"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
zeroize = "=1.9.0"
tempfile = "=3.27.0"
libc = "=0.2.189"
keyring = "=4.2.0"
tauri = { version = "=2.12.0", features = [] }
tauri-plugin-dialog = "=2.8.0"
tauri-plugin-shell = "=2.4.0"
tauri-plugin-single-instance = "=2.5.0"
tauri-plugin-updater = "=2.13.1"
tauri-plugin-opener = "=2.7.0"
tauri-plugin-notification = "=2.5.1"
tauri-plugin-window-state = "=2.5.0"
tokio = { version = "=1.53.1", features = ["time"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.52.0", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Memory", "Win32_System_Threading"] }
