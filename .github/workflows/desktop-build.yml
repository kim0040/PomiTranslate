name: desktop-build

# Building three installers costs about twenty runner minutes, ten of them on macOS and Windows,
# which bill at a higher rate. It does not run on ordinary pushes or pull requests. Start it by
# hand (Actions > desktop-build > Run workflow, or `gh workflow run desktop-build`) when a change
# to packaging needs checking, or by pushing a release tag.
on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Which installers to build"
        type: choice
        default: linux
        options: [linux, all]
  push:
    tags:
      - "v*"

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Choose installers
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        env:
          ALL: ${{ github.event_name == 'push' || inputs.platforms == 'all' }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          entries = [
              {"name": "Linux x64", "os": "ubuntu-24.04", "bundles": "appimage,deb",
               "artifact": "src-tauri/target/release/bundle/appimage/*"},
              {"name": "macOS", "os": "macos-15", "bundles": "app,dmg",
               "artifact": "src-tauri/target/release/bundle/macos/*.app\nsrc-tauri/target/release/bundle/macos/*.tar.gz*\nsrc-tauri/target/release/bundle/dmg/*.dmg"},
              {"name": "Windows x64", "os": "windows-2025", "bundles": "nsis",
               "artifact": "src-tauri/target/release/bundle/nsis/*"},
          ]
          if os.environ["ALL"] != "true":
              entries = entries[:1]  # a manual run builds Linux only unless "all" is chosen
          print("matrix=" + json.dumps({"include": entries}))
          PY

  package:
    name: ${{ matrix.name }}
    needs: plan
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt pyinstaller==6.16.0
      - name: Install desktop dependencies
        run: pnpm install --frozen-lockfile
      - name: Build native sidecar
        run: pnpm sidecar:build
        env:
          POMI_BUILD_PYTHON: python
      - name: Check core and desktop contracts
        run: |
          python test_core.py
          python tests/test_desktop_entry.py
      - name: Refresh license notices for this platform
        run: node scripts/generate-licenses.mjs
        env:
          POMI_BUILD_PYTHON: python
      # With the updater signing key in the repository secrets, the build also writes the signed
      # update archives (.app.tar.gz / -setup.exe / .AppImage + .sig) that latest.json points to.
      # Without it the package is built exactly as before. Publishing stays a manual release step.
      - name: Build desktop package
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            pnpm exec tauri build --bundles ${{ matrix.bundles }} --config '{"bundle":{"createUpdaterArtifacts":true}}'
          else
            pnpm exec tauri build --bundles ${{ matrix.bundles }}
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: pomitranslate-${{ runner.os }}-${{ runner.arch }}-unsigned
          path: ${{ matrix.artifact }}
          if-no-files-found: error
