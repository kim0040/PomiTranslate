name: ci

# Automatic core checks are limited to Python/dependency changes on main or PRs into main.
# Browser/frontend tests are verified locally and must not trigger the Python suite.
# Packaging is manual/release-tag only; see docs/ci-policy.md.
on:
  pull_request:
    branches: [main]
    paths:
      - "**/*.py"
      - "requirements.txt"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "**/*.py"
      - "requirements.txt"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Core regression
        run: python test_core.py
      - name: Compatibility fixtures
        run: python tests/test_release_fixtures.py
      - name: Brand and secret surfaces
        run: python tests/test_brand_secrets.py
      - name: Desktop entry
        run: python tests/test_desktop_entry.py
      - name: Providers and remembered settings
        run: python tests/test_providers.py
      - name: Desktop credential routing boundary
        run: python tests/test_desktop_provider.py
      - name: Settings validation and recovery
        run: python tests/test_settings_transaction.py
      - name: Scan scope settings
        run: python tests/test_scan_settings.py
      - name: Provider usage and credential redaction
        run: python tests/test_desktop_usage.py
      - name: Desktop prompt enhancement
        run: python tests/test_desktop_prompt.py
      - name: Safe legacy settings preview
        run: python tests/test_legacy_settings_import.py
      - name: Desktop overrides and file write policy
        run: python tests/test_desktop_parity.py
      - name: Resource pack settings and safe preflight
        run: |
          python tests/test_resource_pack_settings.py
          python tests/test_resource_pack_preflight.py
      - name: World input path containment
        run: python tests/test_world_path_boundary.py
      - name: Explicit external ZIP scan and restore
        run: python tests/test_desktop_external_packs.py
      - name: New external chunk creation and recovery
        run: python tests/test_external_chunk_restore.py
      - name: Cancellation usage reporting
        run: python tests/test_cancelled_usage.py
      - name: Failure reporting and retry
        run: python tests/test_reliability.py
      - name: Text extraction and NBT round trip
        run: python tests/test_extraction.py
      - name: SNBT command text (Java 1.21.5+)
        run: python tests/test_snbt_commands.py
      - name: Launcher world discovery is read-only
        run: python tests/test_world_discovery.py
      - name: Saved data survives damage and reset keeps backups
        run: python tests/test_user_data_durability.py
      - name: World write lock and session lock survive crashes
        run: python tests/test_world_locking.py
      - name: Durable writes flush only writable handles and clean up
        run: python tests/test_durable_writes.py
      - name: Region slots, ZIP members, restore guards and resumable partial runs
        run: python tests/test_core_integrity.py
      - name: Batch request budget, failure codes and untrusted-data prompt
        run: python tests/test_batch_budget.py
      - name: JSONL channel is UTF-8, protocol-only and crash-proof
        run: python tests/test_jsonl_channel.py
      - name: Provider redirects, own-key routing, redaction, request budgets
        run: python tests/test_provider_hardening.py
      - name: Formatter and Minecraft placeholder preservation
        run: python tests/test_text_tokens.py
      - name: Legacy web UI token, Host, Origin and JSON checks
        run: python tests/test_webui_security.py
      - name: Write journal, staged transaction and fault-injection matrix
        run: python tests/test_journal.py
      - name: Guarded recovery, conflicts and interrupted restores
        run: python tests/test_recovery.py
      - name: Provider/core retry contract by error kind
        run: python tests/test_retry_contract.py
      - name: Review follow-ups for write reporting, layout gate, locks and diagnostics
        run: python tests/test_review_a_followups.py
      - name: Review drafts survive restarts and stay bounded
        run: python tests/test_review_drafts.py
      - name: Glossary store, CSV/TSV import and export, conflicts and damaged files
        run: python tests/test_glossary.py
      - name: Glossary terms in a translation, cache keys, retry and warnings
        run: python tests/test_glossary_translation.py
      - name: Glossary source folding shared with the UI, fixture cases and casefold table
        run: python tests/test_glossary_fold.py
      - name: Source letters left next to a format code are detected
        run: python tests/test_format_residue.py
      - name: Backup deletion and pruning respect locks, last copies and open recoveries
        run: python tests/test_backup_admin.py
      - name: Journal review fixes - one reconciliation gate, verify-only keep, identity checks
        run: python tests/test_journal_review.py
      - name: Interrupted resume reconciled, keep quarantines every conflict, per-world generation counter
        run: python tests/test_journal_reconcile.py
      - name: Real process kills at every write, durable replace and recovery boundary
        run: python tests/test_journal_kill.py
      - name: The core cancels and exits when the shell closes its stdin
        run: python tests/test_eof_shutdown.py
      - name: Review drafts and backup administration through the desktop dispatch
        run: python tests/test_desktop_dispatch.py
